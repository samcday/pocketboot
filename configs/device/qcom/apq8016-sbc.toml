name = "DragonBoard 410c"

[kconfig]
# User LEDs
NEW_LEDS = true
LEDS_CLASS = true
LEDS_GPIO = true
LEDS_TRIGGERS = true
LEDS_TRIGGER_HEARTBEAT = true

# HDMI output via the on-SoC MDP5 and DSI controller into the board's ADV7533
# bridge. Keep every driver built in: the Pocketboot initramfs loads no modules.
# Disable the bootloader framebuffer passthrough so the MSM KMS driver owns the
# first DRM card instead of simpledrm.
DRM_SIMPLEDRM = false
IOMMU_SUPPORT = true
QCOM_IOMMU = true
DRM_MSM = true
DRM_MSM_MDP5 = true
DRM_MSM_DSI = true
DRM_MSM_DSI_28NM_PHY = true
DRM_I2C_ADV7511 = true

# Board buttons. Volume Up is a TLMM gpio-keys button; Volume Down is the
# PM8916 PON RESIN key exposed by the pm8941-pwrkey driver.
INPUT_PM8941_PWRKEY = true

# USB ID GPIO and onboard USB3503 hub
EXTCON_USB_GPIO = true
USB_HSIC_USB3503 = true
