name = "Qualcomm MSM8930"

[kernel]
arch = "arm"
image = "zImage"

[kconfig]
# Platform
MMU = true
# Preserve the uniprocessor configuration used for Expressltexx cold boots.
# ARM32 kexec support is separate from these development builds.
SMP = false
HOTPLUG_CPU = "omit"
ARCH_MULTI_V7 = true
ARCH_QCOM = true
NR_CPUS = "omit"
HIGHMEM = true
CMA = true
DMA_CMA = true
CMA_SIZE_MBYTES = 64
ARM_PATCH_IDIV = true
VFP = true
NEON = true
ARM_THUMB = true
COMPAT_32BIT_TIME = true

# Stock aboot passes ATAGS in r2; zImage finds the appended DTB.
ARM_PATCH_PHYS_VIRT = true
ATAGS = true
ARM_APPENDED_DTB = true
ARM_ATAG_DTB_COMPAT = true
ARM_ATAG_DTB_COMPAT_CMDLINE_FROM_BOOTLOADER = true
AUTO_ZRELADDR = true

# Kernel Rust/QR panic rendering and kexec_file_load are not supported on ARM32.
RUST = false
KEXEC_FILE = "omit"
RANDOMIZE_BASE = "omit"
RELOCATABLE = "omit"
DRM_PANIC_SCREEN_QR_CODE = "omit"
DRM_PANIC_SCREEN = { string = "user" }

# Core Qualcomm firmware/resource plumbing
QCOM_SCM = true
QCOM_SMEM = true
QCOM_SOCINFO = true
HWSPINLOCK = true
HWSPINLOCK_QCOM = true
MFD_QCOM_RPM = true
PM_DEVFREQ = true

# Clocks, pinctrl, GPIO and PMIC access
COMMON_CLK_QCOM = true
QCOM_CLK_RPM = true
MSM_GCC_8960 = true
MSM_MMCC_8960 = true
PINCTRL = true
GPIOLIB = true
PINCTRL_MSM = true
PINCTRL_MSM8960 = true
PINCTRL_QCOM_SSBI_PMIC = true
MFD_PM8XXX = true
REGULATOR = true
REGULATOR_QCOM_RPM = true
POWER_RESET = true
POWER_RESET_MSM = true
INPUT_PMIC8XXX_PWRKEY = true

# GSBI UART/I2C and DMA
SERIAL_MSM = true
SERIAL_MSM_CONSOLE = true
I2C_QUP = true
DMADEVICES = true
QCOM_BAM_DMA = true
QCOM_GSBI = true

# eMMC/SD storage on MSM8930 is PL18x/AMBA, not SDHCI.
MMC_ARMMMCI = true
MMC_QCOM_DML = true

# USB HS controller/PHY for the configfs gadget UDC.
USB_EHCI_HCD = true
USB_CHIPIDEA = true
USB_CHIPIDEA_UDC = true
USB_CHIPIDEA_HOST = true
USB_CHIPIDEA_MSM = true
GENERIC_PHY = true
PHY_QCOM_USB_HS = true
