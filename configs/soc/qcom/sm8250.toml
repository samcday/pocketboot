name = "Qualcomm SM8250"

[kconfig]
# Platform sizing
ARCH_QCOM = true
NR_CPUS = 8

# Qualcomm firmware, resource management and interconnects
QCOM_SCM = true
QCOM_COMMAND_DB = true
QCOM_RPMH = true
QCOM_CLK_RPMH = true
QCOM_RPMHPD = true
QCOM_SMEM = true
QCOM_SOCINFO = true
HWSPINLOCK = true
HWSPINLOCK_QCOM = true
MAILBOX = true
QCOM_AOSS_QMP = true
QCOM_APCS_IPC = true
QCOM_PDC = true
QCOM_GENI_SE = true
CPU_IDLE = true
ARM_PSCI_CPUIDLE = true
ARM_PSCI_CPUIDLE_DOMAIN = true
INTERCONNECT = true
INTERCONNECT_QCOM = true
INTERCONNECT_QCOM_SM8250 = true
INTERCONNECT_QCOM_OSM_L3 = true

# Clocks, pinctrl, PMICs, regulators and reset
COMMON_CLK_QCOM = true
SM_GCC_8250 = true
PINCTRL_MSM = true
PINCTRL_SM8250 = true
SPMI = true
SPMI_MSM_PMIC_ARB = true
MFD_SPMI_PMIC = true
PINCTRL_QCOM_SPMI_PMIC = true
REGULATOR = true
REGULATOR_QCOM_RPMH = true
POWER_RESET_MSM = true
POWER_RESET_QCOM_PON = true
NVMEM = true
NVMEM_QCOM_QFPROM = true

# DMA and GENI buses
IOMMU_SUPPORT = true
ARM_SMMU = true
ARM_SMMU_QCOM = true
SERIAL_QCOM_GENI = true
SERIAL_QCOM_GENI_CONSOLE = true
I2C_QCOM_GENI = true
SPI_QCOM_GENI = true
DMADEVICES = true
QCOM_GPI_DMA = true

# UFS storage
SCSI = true
BLK_DEV_SD = true
SCSI_UFSHCD = true
SCSI_UFSHCD_PLATFORM = true
SCSI_UFS_QCOM = true
GENERIC_PHY = true
PHY_QCOM_QMP = true
PHY_QCOM_QMP_UFS = true

# USB gadget controller and its HS/SS PHYs
USB_DWC3 = true
USB_DWC3_GADGET = true
USB_DWC3_QCOM = true
PHY_QCOM_USB_SNPS_FEMTO_V2 = true
PHY_QCOM_QMP_COMBO = true
